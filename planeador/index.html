<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seguimiento Plataforma AVM</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Tablero oscuro con los colores de AVM (verde #94B63C y naranja #F08248 del logo).
   Arriba: indicadores, barra y estado. Abajo: grupos desplegables por etapa. Edición con PIN. */
:root {
  --bg1: #0E150B; --bg2: #18240F; --card: rgb(255 255 255 / .045); --card-h: rgb(255 255 255 / .075); --line: rgb(255 255 255 / .09);
  --ink: #F1F4EA; --muted: #9AA58C; --dim: #6C7660;
  --verde: #94B63C; --verde-l: #B5D25E; --naranja: #F08248; --naranja-l: #F7A57A; --amarillo: #F2C14E; --rojo: #FF6B5E;
  --f: "DM Sans", "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html { -webkit-text-size-adjust: 100%; background: var(--bg1) }
body { margin: 0; min-height: 100vh; color: var(--ink); font: 400 14.5px/1.5 var(--f);
  background: radial-gradient(1200px 600px at 80% -10%, rgb(148 182 60 / .16), transparent 60%), radial-gradient(900px 500px at 0% 100%, rgb(240 130 72 / .10), transparent 60%), linear-gradient(160deg, var(--bg2), var(--bg1) 70%) fixed }
h1, h2, h3, p { margin: 0 }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0 }
button:focus-visible, select:focus-visible { outline: 2px solid var(--verde); outline-offset: 2px }
.mono { font-family: var(--mono) }

/* Encabezado */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: rgb(0 0 0 / .18); flex-wrap: wrap }
.brand { display: flex; align-items: center; gap: 12px }
.brand .ico { width: 42px; height: 42px; border-radius: 10px; background: var(--verde); display: grid; place-items: center; padding: 6px }
.brand .ico img { width: 100%; height: auto; filter: brightness(0) invert(1) }
.brand h1 { font-size: 17px; font-weight: 700 }
.brand small { display: block; font: 700 11px/1.3 var(--mono); color: var(--naranja); letter-spacing: .06em; text-transform: uppercase }
.acts { display: flex; gap: 8px; align-items: center }
.ibtn { width: 36px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--verde-l) }
.ibtn:hover { background: var(--card-h) }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); font-size: 13px; font-weight: 600 }
.pill:hover { background: var(--card-h) }
.pill.on { background: var(--naranja); border-color: var(--naranja); color: #1B0F06 }
.fechahora { padding: 8px 20px; font: 500 11.5px/1 var(--mono); color: var(--dim) }
.save { font: 600 11.5px/1 var(--mono); color: var(--muted) }
.save.ok { color: var(--verde-l) } .save.err { color: var(--rojo) }

.vistas { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-width: 940px; margin: 18px auto 0; padding: 5px; border: 1px solid var(--line); border-radius: 14px; background: rgb(0 0 0 / .2); width: calc(100% - 32px) }
.vistas button { padding: 11px 12px; border-radius: 10px; font-weight: 700; font-size: 14.5px; color: var(--muted); display: grid; gap: 1px; text-align: center }
.vistas button small { font: 600 10.5px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; opacity: .8 }
.vistas button:hover { color: var(--ink); background: var(--card) }
.vistas button[aria-pressed="true"] { background: var(--verde); color: #14200A }
.vistas button[data-v="b2b"][aria-pressed="true"] { background: var(--naranja); color: #1B0F06 }
.wrap { max-width: 940px; margin: 0 auto; padding: 22px 16px 70px }

/* Indicadores */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px }
.stat { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 14px 10px; text-align: center }
.stat b { display: block; font: 700 24px/1.1 var(--mono); font-variant-numeric: tabular-nums }
.stat span { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.c-nar { color: var(--naranja) } .c-ver { color: var(--verde-l) } .c-ama { color: var(--amarillo) } .c-gri { color: #C9D1BD }
.barra { height: 7px; border-radius: 99px; background: rgb(255 255 255 / .07); margin: 20px 0 18px; overflow: hidden; position: relative }
.barra i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: linear-gradient(90deg, var(--naranja), var(--amarillo) 45%, var(--verde)) }
.barra u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .7; text-decoration: none }

/* Mensaje de estado */
.semana { border: 1px solid rgb(148 182 60 / .35); background: var(--card); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; display: grid; gap: 10px }
.semana .cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap }
.semana .cab b { font-size: 16px; font-weight: 700 }
.semana .cab span { font: 600 11.5px/1 var(--mono); color: var(--verde-l); text-transform: uppercase; letter-spacing: .06em }
.semana ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px }
.semana li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: baseline; font-size: 14.5px }
.semana li small { font: 500 11.5px/1.4 var(--mono); color: var(--muted) }
.semana .vacio2 { font-size: 14px; color: var(--muted) }
.msg { border: 1px solid var(--line); border-left: 3px solid var(--st, var(--naranja)); background: var(--card); border-radius: 10px; padding: 13px 16px; font-size: 14px; color: #D9DFCF }
.msg b { color: var(--ink) }
.msg em { color: var(--verde-l) }

/* Filtros */
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0 14px }
.chip { height: 30px; padding: 0 13px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); font-size: 13px; color: #C9D1BD }
.chip:hover { background: var(--card-h) }
.chip[aria-pressed="true"] { background: rgb(240 130 72 / .18); border-color: var(--naranja); color: var(--naranja-l); font-weight: 600 }

/* Grupos */
.grupo { border: 1px solid var(--line); background: var(--card); border-radius: 12px; margin-bottom: 12px; overflow: hidden }
.grupo.actual { border-color: rgb(148 182 60 / .55); box-shadow: 0 0 0 1px rgb(148 182 60 / .25) inset }
/* Compromisos de AVM: naranja, para que AVM vea qué debe entregar y cuándo */
.grupo.avm { border: 1.5px solid var(--naranja); background: linear-gradient(90deg, rgb(240 130 72 / .20), rgb(240 130 72 / .08)) }
.grupo.avm > summary:hover { background: rgb(240 130 72 / .12) }
.grupo.avm .tt b { color: var(--naranja-l); font-size: 16px }
.grupo.avm .tt small { color: #F3C4A8 }
.grupo.avm .tt small b { color: var(--ink); font: inherit; font-weight: 700; display: inline }
.grupo.avm .mbar i { background: var(--naranja) }
.grupo.avm .pct, .grupo.avm .chev { color: var(--naranja-l) }
.grupo.avm .tareas { border-top-color: rgb(240 130 72 / .35) }
.grupo.avm .t + .t { border-top-color: rgb(240 130 72 / .15) }
.fecha-avm { display: inline-block; font: 700 11.5px/1 var(--mono); color: #1B0F06; background: var(--naranja); border-radius: 6px; padding: 4px 7px; margin-top: 3px; justify-self: start }
.fecha-avm.late { background: var(--rojo); color: #fff }
.fecha-avm.ok { background: rgb(148 182 60 / .25); color: var(--verde-l) }
.grupo > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 28px minmax(0, 1fr) 64px 42px 16px; gap: 14px; align-items: center; padding: 14px 18px }
.grupo > summary::-webkit-details-marker { display: none }
.grupo > summary:hover { background: var(--card-h) }
.grupo .emo { font-size: 20px; text-align: center }
.grupo .tt b { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15px; font-weight: 700 }
.grupo .tt small { display: block; font: 500 11.5px/1.5 var(--mono); color: var(--muted) }
.tag { font: 700 10px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 3px 6px; border-radius: 5px; background: rgb(255 255 255 / .08); color: #C9D1BD }
.tag.b2c { background: rgb(148 182 60 / .18); color: var(--verde-l) }
.tag.b2b { background: rgb(240 130 72 / .18); color: var(--naranja-l) }
.tag.wl { background: rgb(242 193 78 / .16); color: var(--amarillo) }
.tag.now { background: var(--verde); color: #14200A }
.tag.late { background: rgb(255 107 94 / .18); color: var(--rojo) }
.mbar { height: 5px; border-radius: 99px; background: rgb(255 255 255 / .08); overflow: hidden }
.mbar i { display: block; height: 100%; border-radius: 99px; background: var(--naranja) }
.mbar i.full { background: var(--verde) }
.pct { font: 600 12px/1 var(--mono); color: var(--muted); text-align: right }
.chev { color: var(--muted); font-size: 12px; transition: transform .15s; text-align: center }
.grupo[open] .chev { transform: rotate(180deg) }

/* Tareas */
.tareas { border-top: 1px solid var(--line); padding: 6px 0 }
.t { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 10px 18px 10px 60px }
.t + .t { border-top: 1px solid rgb(255 255 255 / .04) }
.t .dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 5px; border: 2px solid var(--dim) }
.t .dot.hecho { background: var(--verde); border-color: var(--verde) }
.t .dot.curso { border-color: var(--amarillo); background: linear-gradient(90deg, var(--amarillo) 50%, transparent 50%) }
.t .dot.late { border-color: var(--rojo) }
.t .dot.avm { border-color: var(--naranja) }
.t .dot.avm.hecho { background: var(--naranja) }
.t .tx { display: grid; gap: 2px; min-width: 0 }
.t .tx span { font-size: 14.5px }
.t.hecho .tx span { color: var(--muted); text-decoration: line-through; text-decoration-color: rgb(255 255 255 / .2) }
.t .tx small { font: 500 11.5px/1.5 var(--mono); color: var(--dim) }
.t .tx small.late { color: var(--rojo) }
.est { font: 600 11.5px/1 var(--f); padding: 5px 9px; border-radius: 99px; white-space: nowrap; background: rgb(255 255 255 / .06); color: var(--muted) }
.est.hecho { background: rgb(148 182 60 / .16); color: var(--verde-l) }
.est.curso { background: rgb(242 193 78 / .14); color: var(--amarillo) }
.est.late { background: rgb(255 107 94 / .14); color: var(--rojo) }
select.est { appearance: none; border: 1px solid var(--line); font-family: var(--f); cursor: pointer; padding-right: 22px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 12px) 50%, calc(100% - 8px) 50%; background-size: 4px 4px; background-repeat: no-repeat }
select.est option { background: #1B2513; color: var(--ink) }
.hito { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 12px; padding: 9px 18px 9px 60px; font-size: 14px }
.hito time { font: 500 12px/1.6 var(--mono); color: var(--muted) }
.hito.pasado { color: var(--muted) }
.vacio { padding: 18px; text-align: center; color: var(--muted) }

footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; text-align: center; font: 500 11px/1.4 var(--mono); color: var(--dim); background: linear-gradient(transparent, rgb(0 0 0 / .45)) }

/* PIN */
dialog { border: 1px solid rgb(240 130 72 / .35); border-radius: 16px; padding: 0; background: #17210F; color: var(--ink); width: min(340px, calc(100% - 32px)); box-shadow: 0 30px 80px rgb(0 0 0 / .6) }
dialog::backdrop { background: rgb(5 8 4 / .7); backdrop-filter: blur(6px) }
.pin { padding: 26px 26px 24px; display: grid; gap: 14px }
.pin h3 { font-size: 17px; font-weight: 700; color: var(--naranja) }
.pin p { font-size: 13px; color: var(--muted); margin-top: -8px }
.cajas { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px }
.cajas input { width: 100%; aspect-ratio: 1 / 1.15; text-align: center; font: 700 20px var(--mono); color: var(--ink); background: rgb(255 255 255 / .05); border: 1px solid var(--line); border-radius: 10px; -webkit-text-security: disc }
.cajas input:focus { outline: 0; border-color: var(--naranja); background: rgb(240 130 72 / .08) }
.pin .err { color: var(--rojo); font-size: 12.5px; text-align: center }
.pin .go { height: 42px; border-radius: 10px; font-weight: 700; color: #1B0F06; background: linear-gradient(90deg, var(--naranja), #F5A04F) }
.pin .go:disabled { opacity: .6 }
.pin .no { font-size: 12.5px; color: var(--muted); justify-self: center }

@media (max-width: 640px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .grupo > summary { grid-template-columns: 26px minmax(0, 1fr) 40px 14px; gap: 10px; padding: 13px 14px }
  .grupo > summary .mbar { display: none }
  .t { grid-template-columns: 18px minmax(0, 1fr); padding: 10px 14px 10px 20px }
  .t .est { grid-column: 2; justify-self: start }
  .hito { grid-template-columns: 1fr; gap: 0; padding: 8px 14px 8px 20px }
  .brand small { font-size: 9.5px }
}
</style>
</head>

<header class="top">
  <div class="brand">
    <span class="ico"><img src="img/logo-blanco.png" alt="AVM" width="30" height="10"></span>
    <div><h1>Seguimiento de Proyecto</h1><small id="subtitulo">B2C · Sitio para el viajero</small></div>
  </div>
  <div class="acts">
    <span class="save" id="save" aria-live="polite"></span>
    <button class="ibtn" id="bRefrescar" title="Actualizar" aria-label="Actualizar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>

</header>
<div class="fechahora" id="fechahora"></div>
<nav class="vistas" aria-label="Proyecto">
  <button data-v="b2c" aria-pressed="true">B2C<small>Sitio para el viajero</small></button>
  <button data-v="b2b" aria-pressed="false">Travel Booking &amp; Distribution<small>Portal B2B para agencias</small></button>
</nav>

<main class="wrap">
  <div class="stats" id="stats"></div>
  <div class="barra" id="barra" title="La línea blanca marca dónde deberíamos ir según el plan"><i></i><u></u></div>
  <div class="semana" id="semana"></div>
  <p class="msg" id="msg"></p>
  <div class="chips" id="chips" role="group" aria-label="Filtrar por estado"></div>
  <div id="grupos"></div>
</main>
<footer id="pie"></footer>

<dialog id="dlg">
  <form class="pin" id="pinForm">
    <h3>Acceso administrador</h3>
    <p>Ingrese el PIN para editar</p>
    <div class="cajas" id="cajas">
      <input inputmode="numeric" maxlength="1" aria-label="Dígito 1" autocomplete="one-time-code"><input inputmode="numeric" maxlength="1" aria-label="Dígito 2"><input inputmode="numeric" maxlength="1" aria-label="Dígito 3"><input inputmode="numeric" maxlength="1" aria-label="Dígito 4"><input inputmode="numeric" maxlength="1" aria-label="Dígito 5"><input inputmode="numeric" maxlength="1" aria-label="Dígito 6">
    </div>
    <span class="err" id="pinErr" hidden></span>
    <button class="go" id="pinGo">Ingresar</button>
    <button type="button" class="no" id="pinNo">Cancelar</button>
  </form>
</dialog>

  let ok = false;
  try { const r = await fetch("estado.json?" + Date.now(), { cache: "no-store" }); if (r.ok) { const j = await r.json(); if (j && typeof j === "object") { estado = { ...estado, ...j }; ok = true; } } } catch (e) {}
  if (!ok) { try { const l = JSON.parse(localStorage.getItem(LS) || "null"); if (l) estado = { ...estado, ...l }; } catch (e) {} }
  for (const k of ["tareas", "avm", "notas"]) if (!estado[k] || Array.isArray(estado[k])) estado[k] = {};
  if (Q.has("demo")) tareas.forEach(t => { if (t.sem.fin < HOY) estado.tareas[t.id] = t.sem.n % 7 ? "hecho" : "curso"; else if (t.sem === SEM) estado.tareas[t.id] = "curso"; });  // solo vista previa
  pintar();
}
function cambio() {
  estado.actualizado = new Date().toISOString();
  try { localStorage.setItem(LS, JSON.stringify(estado)); } catch (e) {}
  avisar("guardando…"); clearTimeout(tG); tG = setTimeout(subir, 600); pintar();
}
async function subir() {
  if (!servidor) { avisar("guardado en este navegador", "ok"); return; }
  try {
    const r = await fetch("guardar.php", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ clave: pin, estado }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) avisar("✓ guardado", "ok");
    else if (r.status === 403 || r.status === 429) { avisar(j.error || "PIN incorrecto", "err"); modo(false); }
    else avisar("no se pudo guardar", "err");
  } catch (e) { avisar("sin conexión", "err"); }
}
function avisar(t, c) { const s = $("#save"); s.textContent = t; s.className = "save " + (c || ""); }

// ---------- Cálculos ----------
const est = t => estado.tareas[t.id] || "";
const tarde = t => est(t) !== "hecho" && t.sem.fin < HOY && t.sem !== SEM;
const estT = t => est(t) === "hecho" ? "hecho" : est(t) === "curso" ? "curso" : tarde(t) ? "late" : "pend";
const listo = a => estado.avm[a.id] === "listo";

// ---------- Pintar ----------
let filtro = "todos";
const normVista = v => v === "b2b" || v === "tbd" ? "b2b" : "b2c";
let vista = (() => { const h = location.hash.slice(1); if (h) return normVista(h); try { return normVista(localStorage.getItem("avm-seg-vista")); } catch (e) { return "b2c"; } })();
const enVista = p => vista === "b2b" ? p === "B2B" : p !== "B2B";
const abiertos = new Set();
function pintar() {
  const TV = tareas.filter(t => enVista(t.proy)), iniV = TV[0].sem.ini, finV = TV[TV.length - 1].sem.fin;
  document.querySelectorAll(".vistas button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === vista));
  $("#subtitulo").textContent = vista === "b2b" ? "Travel Booking & Distribution · Portal B2B" : "B2C · Sitio para el viajero";
  const total = TV.length, hechas = TV.filter(t => est(t) === "hecho").length, curso = TV.filter(t => est(t) === "curso").length;
  const pct = Math.round(hechas / total * 100), esperadas = TV.filter(t => t.sem.fin < HOY).length;
  $("#stats").innerHTML = [[pct + "%", "Progreso", "c-nar"], [hechas, "Completadas", "c-ver"], [curso, "En progreso", "c-ama"], [total - hechas - curso, "Pendientes", "c-gri"]]
    .map(([v, l, c]) => `<div class="stat"><b class="${c}">${v}</b><span>${l}</span></div>`).join("");
  $("#barra i").style.width = pct + "%"; $("#barra u").style.left = `calc(${esperadas / total * 100}% - 1px)`;

  // Mensaje de estado
  const pend = TV.find(t => est(t) !== "hecho"), msg = $("#msg");
  let txt, st;
  if (HOY < iniV) { st = ""; txt = ""; }
  else if (!pend) { st = "var(--verde)"; txt = `🏁 <b>Proyecto entregado.</b> Todas las tareas del plan están completadas.`; }
  else {
    const atraso = Math.max(0, (SEM ? SEM.n : semanas.length + 1) - pend.sem.n), mov = curso;
    if (tarde(pend)) { st = atraso > 2 ? "var(--rojo)" : "var(--amarillo)"; txt = `⚠️ <b>${pl(atraso, "semana", "semanas")} de atraso.</b> `; }
    else { st = "var(--verde)"; txt = `🚀 <b>Vamos al día.</b> `; }
    if (mov) txt += ` <em>(${pl(mov, "tarea", "tareas")} en movimiento)</em>`;
  }
  msg.style.setProperty("--st", st); msg.innerHTML = txt; msg.hidden = !txt;

  // Cuadro de la semana: fecha y entregables de la semana actual (o de la primera, si aún no empieza)
  const ref = SEM || (HOY < INI ? semanas[0] : null);
  const box = $("#semana");
  if (!ref) box.hidden = true;
  else {
    box.hidden = false;
    const ts = ref.tareas.filter(t => enVista(t.proy));
    const fin7 = new Date(ref.fin.getTime() + 2 * 864e5);
    const aw = avm.filter(a => enVista(a.proy) && !listo(a) && !a.opc && a.fechaD <= fin7 && (a.fechaD >= ref.ini || a.fechaD < HOY));
    const ESTXT = { hecho: "Completado", curso: "En progreso", late: "Atrasado", pend: "Pendiente" };
    let li = ts.map(t => `<li><span class="tag ${t.proy.toLowerCase()}">${PRE[t.proy]}</span><span>${esc(t.txt)}${t.parte ? ` <small>(${t.parte === 1 ? "1.ª" : "2.ª"} parte)</small>` : ""}</span><span class="est ${estT(t)}">${ESTXT[estT(t)]}</span></li>`).join("");
    li += aw.map(a => `<li><span class="tag b2b" style="background:rgb(240 130 72 / .18)">AVM</span><span>${esc(a.txt)} <small>· ${a.modo === "durante" ? "semana del" : "antes del"} ${f(a.fechaD)}</small></span><span class="est ${a.fechaD < HOY ? "late" : ""}">${a.fechaD < HOY ? "Vencido" : "Pendiente"}</span></li>`).join("");
    if (!li) { const sig = TV.find(t => t.sem.ini > ref.fin); li = `<li class="vacio2" style="display:block">Esta semana no hay entregas de este proyecto.${sig ? ` La próxima es la semana ${sig.sem.n} (${f(sig.sem.ini)}): ${esc(sig.txt)}` : ""}</li>`; }
    box.innerHTML = `<div class="cab"><b>${SEM ? "Semana actual" : "Primera semana"} · ${f(ref.ini)} – ${fy(ref.fin)}</b><span>Semana ${ref.n} de ${semanas.length}</span></div><ul>${li}</ul>`;
  }

  // Filtros
  const F = [["todos", "Todos"], ["pend", "Pendiente"], ["curso", "En progreso"], ["hecho", "Completado"]];
  $("#chips").innerHTML = F.map(([k, l]) => `<button class="chip" data-f="${k}" aria-pressed="${filtro === k}">${l}</button>`).join("");

  // Grupo AVM
  const pasaF = e => filtro === "todos" || filtro === e || (filtro === "pend" && e === "late");
  let html = "";
  const AV = avm.filter(a => enVista(a.proy)), avmVis = AV.filter(a => pasaF(listo(a) ? "hecho" : "pend"));
  if (avmVis.length) {
    const lst = AV.filter(listo).length, venc = AV.filter(a => !listo(a) && !a.opc && a.fechaD < HOY).length;
    html += grupo("avm", "📌", `AVM debe entregar ${venc ? `<span class="tag late">${pl(venc, "vencido", "vencidos")}</span>` : ""}`, (() => { const sig = AV.filter(a => !listo(a) && !a.opc).sort((x, y) => x.fechaD - y.fechaD)[0];
        return sig ? `Lo que AVM debe tener listo y cuándo · Próximo: <b>${esc(sig.txt.replace(/^AVM /, "").slice(0, 70))}${sig.txt.length > 74 ? "…" : ""}</b> · ${sig.modo === "durante" ? "semana del" : "antes del"} ${fy(sig.fechaD)}` : `${lst}/${AV.length} listos · AVM no tiene pendientes`; })(), lst, AV.length, "avm",
      avmVis.map(a => {
        const l = listo(a), d = dias(HOY, a.fechaD), late = !l && !a.opc && d < 0;
        const control = editar ? `<select class="est ${l ? "hecho" : ""}" data-a="${a.id}"><option value="">Pendiente</option><option value="listo" ${l ? "selected" : ""}>Listo</option></select>`
          : `<span class="est ${l ? "hecho" : late ? "late" : ""}">${l ? "Listo" : late ? "Vencido" : a.opc ? "Opcional" : "Pendiente"}</span>`;
        return `<div class="t ${l ? "hecho" : ""}"><i class="dot avm ${l ? "hecho" : ""}"></i><div class="tx"><span>${esc(a.txt.replace(/^Opcional: /, ""))}</span><span class="fecha-avm ${l ? "ok" : late ? "late" : ""}">${l ? "✓ Listo" : (a.modo === "durante" ? "Semana del " : "Antes del ") + fy(a.fechaD)}${late ? " · vencido" : ""}</span><small>${a.opc ? "Opcional · " : ""}Para: ${esc(etapaDe(a))}</small></div>${control}</div>`;
      }).join(""));
  }
  // Etapas
  for (const e of etapas) {
    if (!e.filas.length || !enVista(e.proy)) continue;
    const vis = e.filas.filter(t => pasaF(estT(t))); if (!vis.length) continue;
    const h = e.filas.filter(t => est(t) === "hecho").length, n = e.filas.length;
    const ini = e.filas[0].sem.ini, fin = e.filas[n - 1].sem.fin, enCurso = SEM && ini <= SEM.fin && fin >= SEM.ini, late = e.filas.some(tarde);
    const tags = `<span class="tag ${e.proy.toLowerCase()}">${PRE[e.proy]}</span>${enCurso ? '<span class="tag now">Semana actual</span>' : ""}${late ? '<span class="tag late">Atrasada</span>' : ""}`;
    html += grupo(e.nombre, emoji(e.nombre), `${esc(e.corto)} ${tags}`, `${h}/${n} completadas · ${f(ini)} – ${f(fin)}`, h, n, enCurso ? "actual" : "",
      vis.map(t => {
        const s = estT(t);
        const control = editar ? `<select class="est ${s}" data-t="${t.id}"><option value="">Pendiente</option><option value="curso" ${s === "curso" ? "selected" : ""}>En progreso</option><option value="hecho" ${s === "hecho" ? "selected" : ""}>Completado</option></select>`
          : `<span class="est ${s}">${{ hecho: "Completado", curso: "En progreso", late: "Atrasado", pend: "Pendiente" }[s]}</span>`;
        return `<div class="t ${s}"><i class="dot ${s}"></i><div class="tx"><span>${esc(t.txt)}</span><small class="${s === "late" ? "late" : ""}">S${String(t.sem.n).padStart(2, "0")} · ${f(t.sem.ini)} – ${f(t.sem.fin)}${t.parte ? ` · ${t.parte === 1 ? "1.ª" : "2.ª"} parte, en paralelo con ${t.proy === "B2C" ? "el B2B" : "el B2C"}` : ""}</small></div>${control}</div>`;
      }).join(""), enCurso);
  }
  // Fechas clave
  if (filtro === "todos") {
    const hs = PLAN.hitos.filter(x => enVista(/Travel Booking/.test(x.txt) ? "B2B" : "B2C")).map(x => ({ txt: x.txt.replace(/ \(.*\)\.?$/, "").replace(/\.$/, ""), d: D(x.fecha) }))
      .concat((vista === "b2b" ? certs : []).map(c => ({ txt: (c.prov === "Hoteles 3" ? "Tercer proveedor de hoteles" : c.prov) + " en producción (estimado)", d: c.fin }))).sort((a, b) => a.d - b.d);
    const pas = hs.filter(x => x.d < HOY).length, prox = hs.find(x => x.d >= HOY);
    html += grupo("hitos", "🏁", "Fechas clave", `${pas}/${hs.length} cumplidas${prox ? ` · próxima: ${fy(prox.d)}` : ""}`, pas, hs.length, "",
      hs.map(x => `<div class="hito ${x.d < HOY ? "pasado" : ""}"><time>${fy(x.d)}</time><span>${x.d < HOY ? "✓ " : ""}${esc(x.txt)}</span></div>`).join(""));
  }
  $("#grupos").innerHTML = html || `<p class="vacio">No hay tareas con este filtro.</p>`;
  $("#pie").textContent = (estado.actualizado ? "Última edición: " + new Date(estado.actualizado).toLocaleString("es-CO", { dateStyle: "medium", timeStyle: "short" }) : "Sin ediciones todavía") + ` · ${vista === "b2b" ? "Travel Booking & Distribution" : "B2C"}: ${fy(iniV)} al ${fy(finV)} · AVM Operadores Mayoristas`;
}
function etapaDe(a) { const e = etapas.find(x => x.filas.length && x.proy === a.proy && x.filas[0].sem.ini >= a.fechaD) || etapas.find(x => x.filas.length && x.proy === a.proy); return e ? e.corto : ""; }
function grupo(id, emo, titulo, sub, h, n, cls, cuerpo, abrirAuto) {
  const p = n ? Math.round(h / n * 100) : 0;
  const abierto = abiertos.has(id) || filtro !== "todos";
  return `<details class="grupo ${cls}" data-g="${esc(id)}" ${abierto ? "open" : ""}><summary><span class="emo" aria-hidden="true">${emo}</span>
    <span class="tt"><b>${titulo}</b><small>${sub}</small></span>
    <span class="mbar"><i class="${p === 100 ? "full" : ""}" style="width:${p}%"></i></span><span class="pct">${p}%</span><span class="chev" aria-hidden="true">▼</span></summary>
    <div class="tareas">${cuerpo}</div></details>`;
}

// Fecha y hora
function reloj() { const n = new Date(); $("#fechahora").textContent = `📅 ${n.toLocaleDateString("es-CO", { day: "numeric", month: "short", year: "numeric" })}   ⏰ ${n.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" })}`; }
reloj(); setInterval(reloj, 30000);

// ---------- Modo edición con PIN ----------
function modo(on) {
  editar = on; if (!on) pin = "";
  const b = $("#bModo"); b.textContent = on ? "✏️ Edición" : "🔒 Lectura"; b.classList.toggle("on", on); pintar();
}
const cajas = [...document.querySelectorAll("#cajas input")];
function abrirPin() {
  if (!servidor && !Q.has("verpin")) { modo(true); return; }
  cajas.forEach(c => c.value = ""); $("#pinErr").hidden = true; $("#dlg").showModal(); cajas[0].focus();
}
cajas.forEach((c, i) => {
  c.addEventListener("input", () => { c.value = c.value.replace(/\D/g, "").slice(-1); if (c.value && i < 5) cajas[i + 1].focus(); if (cajas.every(x => x.value)) $("#pinForm").requestSubmit(); });
  c.addEventListener("keydown", ev => { if (ev.key === "Backspace" && !c.value && i > 0) cajas[i - 1].focus(); });
  c.addEventListener("paste", ev => { const d = (ev.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6); if (d.length) { ev.preventDefault(); d.split("").forEach((x, k) => cajas[k] && (cajas[k].value = x)); (cajas[d.length] || cajas[5]).focus(); if (d.length === 6) $("#pinForm").requestSubmit(); } });
});
$("#pinForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const k = cajas.map(c => c.value).join(""); if (k.length !== 6) { $("#pinErr").textContent = "El PIN tiene 6 dígitos."; $("#pinErr").hidden = false; return; }
  $("#pinGo").disabled = true;
  try {
    const r = await fetch("guardar.php", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ clave: k, verificar: true }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) { pin = k; $("#dlg").close(); modo(true); if (j.nueva) avisar("PIN nuevo: queda fijado al guardar el primer cambio", "ok"); }
    else { $("#pinErr").textContent = j.error || "PIN incorrecto."; $("#pinErr").hidden = false; cajas.forEach(c => c.value = ""); cajas[0].focus(); }
  } catch (e) { $("#pinErr").textContent = "Sin conexión con el servidor."; $("#pinErr").hidden = false; }
  $("#pinGo").disabled = false;
});
$("#pinNo").addEventListener("click", () => $("#dlg").close());
$("#bModo").addEventListener("click", () => editar ? modo(false) : abrirPin());
$("#bRefrescar").addEventListener("click", () => location.reload());
document.addEventListener("click", ev => {
  const c = ev.target.closest("[data-f]"); if (c) { filtro = c.dataset.f; pintar(); return; }
  const v = ev.target.closest(".vistas button"); if (v) { vista = v.dataset.v; history.replaceState(null, "", "#" + vista); try { localStorage.setItem("avm-seg-vista", vista); } catch (e) {} pintar(); }
});
document.addEventListener("change", ev => {
  const s = ev.target.closest("select[data-t]"); if (s) { if (s.value) estado.tareas[s.dataset.t] = s.value; else delete estado.tareas[s.dataset.t]; cambio(); return; }
  const a = ev.target.closest("select[data-a]"); if (a) { if (a.value) estado.avm[a.dataset.a] = "listo"; else delete estado.avm[a.dataset.a]; cambio(); }
});
document.addEventListener("toggle", ev => { const d = ev.target; if (d.dataset && d.dataset.g && filtro === "todos") d.open ? abiertos.add(d.dataset.g) : abiertos.delete(d.dataset.g); }, true);
// Al entrar, queda abierta la etapa de la semana actual (o la primera, si aún no empieza)
abiertos.add("avm");
{ const ref = SEM || (HOY < INI ? semanas[0] : null); if (ref) ref.tareas.forEach(t => { const e = etapas.find(x => x.filas.includes(t)); e && abiertos.add(e.nombre); }); }
cargar();
if (Q.has("verpin")) abrirPin();   // solo para la vista previa de la ventana del PIN
</script>
